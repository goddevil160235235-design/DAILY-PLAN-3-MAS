<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Tracker</title>
<style>
:root{--bg:#eef2f4;--card:#fff;--ink:#1b2b34;--mute:#52626b;--line:#d5dde1;--acc:#1f7a6d;--acc2:#e4f2ef;--warn:#c98a1b;--lo:#e3e9ec;--g1:#d2f0e8;--g2:#d9e6fb;--g3:#eddcf7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a1f;--card:#1a252b;--ink:#e6eef1;--mute:#a6b6c0;--line:#2b3a42;--acc:#3fb5a3;--acc2:#1c3a37;--warn:#e0a63a;--lo:#26343b;--g1:#0c2a2e;--g2:#131b3a;--g3:#2a1741;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121a1f;--card:#1a252b;--ink:#e6eef1;--mute:#a6b6c0;--line:#2b3a42;--acc:#3fb5a3;--acc2:#1c3a37;--warn:#e0a63a;--lo:#26343b;--g1:#0c2a2e;--g2:#131b3a;--g3:#2a1741;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;background:var(--bg);background-image:linear-gradient(145deg,var(--g1) 0%,var(--g2) 55%,var(--g3) 100%);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px 14px 48px}
h1{font:700 26px/1.2 Georgia,"Times New Roman",serif;margin:8px 0 2px}
h2{font:600 16px/1.3 Georgia,serif;margin:0 0 10px}
.sub{color:var(--mute);margin:0 0 14px}
nav{display:flex;gap:6px;background:var(--lo);padding:4px;border-radius:12px;margin-bottom:16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:1 0 auto;white-space:nowrap;border:0;background:none;color:var(--mute);padding:9px 12px;border-radius:9px;font:600 14px inherit;font-family:inherit;cursor:pointer}
nav button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(20,60,70,.10)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bar{height:8px;background:var(--lo);border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:6px;transition:width .25s}
.score{font:700 40px/1 Georgia,serif;color:var(--acc)}
.prayers{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.pr{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 2px;font:600 13px inherit;font-family:inherit;cursor:pointer}
.pr[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;min-width:40px;height:40px;font:600 18px inherit;font-family:inherit;cursor:pointer;padding:0 12px}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-size:15px}
.btn.small{height:32px;font-size:13px;min-width:0}
.val{font-weight:700;min-width:70px;text-align:center}
.chk{width:30px;height:30px;accent-color:var(--acc)}
input[type=text],input[type=number],select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form .full{grid-column:1/-1}
.mute{color:var(--mute);font-size:14px}
.chart{display:flex;align-items:flex-end;gap:4px;height:130px;padding-top:6px}
.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.chart b{width:100%;max-width:34px;background:var(--acc);border-radius:5px 5px 0 0;min-height:3px}
.chart b.z{background:var(--lo)}
.chart span{font-size:11px;color:var(--mute);margin-top:4px;white-space:nowrap}
.heat{display:grid;grid-template-columns:repeat(20,1fr);gap:3px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--lo)}
.sum{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)}
.sum:first-of-type{border-top:0}
details{border-top:1px solid var(--line);padding:8px 0}
summary{cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.pill{font-weight:700;color:var(--acc)}
.manage{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.manage input{width:78px}
textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;resize:vertical}
.todo{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.todo span.t{flex:1;word-break:break-word}
.todo.done span.t{text-decoration:line-through;color:var(--mute)}
.hi{font-size:12px;font-weight:700;color:var(--warn);border:1px solid var(--warn);border-radius:6px;padding:0 6px}
.addrow{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
.addrow select{grid-column:1;width:auto}
.toprow{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:start;margin-bottom:12px}
.tl{display:flex;flex-direction:column;gap:12px}
#view .toprow .card,.toprow .card{margin-bottom:0}
.toprow .recs{grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px}
.toprow .rec{padding:8px}
.toprow .rec b{font-size:18px}
@media (min-width:640px){.toprow{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}}
.layout{display:grid;grid-template-columns:116px minmax(0,1fr);gap:10px;align-items:start}
.menu{display:flex;flex-direction:column;gap:4px;position:sticky;top:58px}
.mi{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:1px;border:0;border-left:3px solid transparent;background:none;color:var(--ink);padding:8px 8px;border-radius:9px;font-family:inherit;font-size:13px;font-weight:600;line-height:1.25;cursor:pointer;width:100%}
.mi .mp{font-size:11px;font-weight:600;color:var(--mute)}
.mi:hover{background:var(--lo)}
.mi[aria-selected="true"]{background:var(--card);border-left-color:var(--acc);box-shadow:0 1px 3px rgba(0,0,0,.12)}
#view .panel .card{margin-bottom:0}
.panel .prayers{grid-template-columns:repeat(auto-fit,minmax(76px,1fr))}
@media (min-width:860px){
main{padding:28px 32px 64px}
h1{font-size:34px}
nav{max-width:none}
.layout{grid-template-columns:210px minmax(0,1fr);gap:20px}
.menu{top:72px}
.mi{font-size:14px;padding:10px 12px}
.mi .mp{font-size:12px}
nav button{font-size:15px;padding:11px 16px}
#view{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
#view .card{padding:20px;margin-bottom:20px;border-radius:16px}
#view>.top,#view>.layout{grid-column:1/-1}
#view>.top{margin-bottom:0}
.chart{height:190px}
.heat{grid-template-columns:repeat(30,1fr)}
.btn:hover,.pr:hover,.stepper button:hover{border-color:var(--acc)}
}
@media (min-width:1400px){
main{max-width:1200px}
}
.exrow{display:grid;grid-template-columns:1fr 96px;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.exrow input{padding:7px 8px}
.exrow .exst{grid-column:1/-1;font-size:13px;color:var(--mute)}
.exrow.ok .exst{color:var(--acc);font-weight:700}
.split{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.amts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:6px}
.amts label{display:flex;flex-direction:column;gap:4px;margin:0}
.recs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.rec{background:var(--lo);border-radius:12px;padding:10px}
.rec b{display:block;font:700 22px/1.2 Georgia,serif;color:var(--acc)}
.sched{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
.sched b{flex:1;min-width:120px}
input[type=time]{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.alarmBox{position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top,0px));z-index:50;display:flex;flex-direction:column;gap:8px;max-width:520px;margin:0 auto}
.alarm{background:var(--card);color:var(--ink);border:2px solid var(--acc);border-radius:14px;padding:12px 14px;box-shadow:0 6px 24px rgba(0,0,0,.28);display:flex;align-items:center;justify-content:space-between;gap:10px;animation:ring .5s ease-in-out infinite alternate}
@keyframes ring{from{transform:translateX(-2px)}to{transform:translateX(2px)}}
.alarm b{font-size:20px}
.alarmBox.on{left:0;right:0;top:0;bottom:0;max-width:none;margin:0;padding:20px;justify-content:center;align-items:center;background:rgba(0,0,0,.6)}
.alarmBox.on .alarm{width:min(100%,420px);flex-direction:column;align-items:stretch;text-align:center;padding:24px}
.alarmBox.on .alarm b{font-size:24px}
.alarmBox.on .btn{height:50px;font-size:18px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}.alarm{animation:none}}
/* ===== Extra background colors for everything ===== */
:root{--c1:#dcf4ec;--c2:#dfeafd;--c3:#f1e3fb;--c4:#fdeed2;--c5:#fde0e6;--inp:#fffdf0;--navbg:#c5e6df;--stripe:rgba(255,255,255,.5)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c1:#12393a;--c2:#172646;--c3:#2f1d47;--c4:#3a2c14;--c5:#3d1a26;--inp:#22313a;--navbg:#1d3a3c;--stripe:rgba(255,255,255,.06)}}
:root[data-theme="dark"]{--c1:#12393a;--c2:#172646;--c3:#2f1d47;--c4:#3a2c14;--c5:#3d1a26;--inp:#22313a;--navbg:#1d3a3c;--stripe:rgba(255,255,255,.06)}
html{background:var(--bg)}
nav{background:var(--navbg)}
nav button:nth-child(5n+1){background:var(--c1)}
nav button:nth-child(5n+2){background:var(--c2)}
nav button:nth-child(5n+3){background:var(--c3)}
nav button:nth-child(5n+4){background:var(--c4)}
nav button:nth-child(5n+5){background:var(--c5)}
nav button[aria-selected="true"]{background:var(--acc);color:#fff}
.card:nth-child(5n+1){background:var(--c1)}
.card:nth-child(5n+2){background:var(--c2)}
.card:nth-child(5n+3){background:var(--c3)}
.card:nth-child(5n+4){background:var(--c4)}
.card:nth-child(5n+5){background:var(--c5)}
.mi:nth-child(5n+1){background:var(--c1)}
.mi:nth-child(5n+2){background:var(--c2)}
.mi:nth-child(5n+3){background:var(--c3)}
.mi:nth-child(5n+4){background:var(--c4)}
.mi:nth-child(5n+5){background:var(--c5)}
.mi[aria-selected="true"]{background:var(--acc);color:#fff;border-left-color:var(--warn)}
.mi[aria-selected="true"] .mp{color:#e8fff9}
.pr{background:var(--c2)}
.stepper button,.btn{background:var(--c3)}
input[type=text],input[type=number],input[type=time],select,textarea{background:var(--inp)}
.rec:nth-child(4n+1){background:var(--c1)}
.rec:nth-child(4n+2){background:var(--c2)}
.rec:nth-child(4n+3){background:var(--c4)}
.rec:nth-child(4n+4){background:var(--c5)}
.todo:nth-child(even),.manage:nth-child(even),.sched:nth-child(even),.exrow:nth-child(even),.sum:nth-child(even){background:var(--stripe);padding-left:8px;padding-right:8px;border-radius:8px}
details{background:var(--stripe);padding:8px 10px;border-radius:10px;margin-top:6px;border-top:0}
.alarm{background:var(--c4)}
/* ===== Always dark ===== */
:root,:root[data-theme="light"],:root[data-theme="dark"]{--bg:#0d1418;--card:#18232a;--ink:#e6eef1;--mute:#a6b6c0;--line:#2b3a42;--acc:#3fb5a3;--acc2:#1c3a37;--warn:#e0a63a;--lo:#23323a;--g1:#0a2326;--g2:#0e1631;--g3:#22123a;--c1:#12393a;--c2:#172646;--c3:#2f1d47;--c4:#3a2c14;--c5:#3d1a26;--inp:#202f38;--navbg:#16302f;--stripe:rgba(255,255,255,.06);color-scheme:dark}
.alarmBox.on{background:rgba(0,0,0,.8)}
</style>
</head>
<body>
<div class="alarmBox" id="alarmBox" aria-live="assertive"></div>
<main>
  <h1>Daily Tracker</h1>
  <p class="sub" id="dateLine"></p>
  <nav role="tablist" id="tabs"></nav>
  <section id="view"></section>
</main>
<script>
(function(){
var KEY='daily_tracker_v1', KEEP=365, BK_KEY='daily_tracker_lastbackup';
var PRAYERS=['Fajr','Zuhr','Asr','Maghrib','Isha'];
var EXERCISES=['Squats','Push-ups','Plank','Lunges','Breathing & Stretching'];
var EX_UNITS=['reps','reps','sec','reps','min'];
var EX_TARGETS=[50,35,60,50,5]; /* daily goals: squats, push-ups, plank (sec), lunges, breathing & stretching (min) */
function goalText(i){return EX_TARGETS[i]+' '+EX_UNITS[i]+(EX_UNITS[i]==='sec'&&EX_TARGETS[i]%60===0?' ('+(EX_TARGETS[i]/60)+' min)':'')}
var DEFAULT_TASKS=[
  {id:'prayer',name:'Prayers',type:'prayer',target:5},
  {id:'coding',name:'Coding',type:'split',target:5},
  {id:'english',name:'English study',type:'split',target:2},
  {id:'malay',name:'Malay language',type:'split',target:2},
  {id:'exercise',name:'Exercise',type:'exercise',target:5},
  {id:'cyber',name:'Cybersecurity',type:'cyber',target:3},
  {id:'sleep',name:'Sleep',type:'sleep',target:6.5}
];
var DEFAULT_SCHED={
  p0:{s:'05:20'},p1:{s:'13:30'},p2:{s:'15:30'},p3:{s:'17:10'},p4:{s:'19:45'},
  exercise:{s:'05:30',e:'06:00'},english:{s:'06:00',e:'08:00'},coding:{s:'08:30',e:'13:30'},
  cyber:{s:'16:00',e:'17:00'},malay:{s:'17:30',e:'19:30'},sleep:{s:'22:45',e:'05:15'}
};
var state={tasks:DEFAULT_TASKS.slice(),logs:{},course:{day:1,phase:1},reviews:{},cyAdded:true,msAdded:true,slAdded:true,sched:{},schedInit:false}, tab='today';
var CY_PHASES=['1: Computer Fundamentals','2: Networking','3: Linux','4: Programming','5: Security Foundation','6: Ethical Hacking Method','7: Web Security','8: Security Tools (legal labs)','9: Practical Training','10: Career Prep'];

function load(){
  try{var raw=localStorage.getItem(KEY);if(raw){var s=JSON.parse(raw);if(s&&Array.isArray(s.tasks)&&s.logs){state=s;state.tasks.forEach(function(t){if(t.id==='exercise'&&t.type==='check'){t.type='exercise';t.target=5}if(SPLITS[t.id]&&(t.type==='hours'||t.type==='coding'||t.type==='split')){t.type='split';t.target=SPLITS[t.id].goals.reduce(function(a,b){return a+b},0)}})}}}catch(e){}
  ensureState();
  prune();
}
function ensureState(){
  if(!state.course||typeof state.course!=='object')state.course={day:1,phase:1};
  if(!state.reviews||typeof state.reviews!=='object')state.reviews={};
  if(!state.cyAdded){
    if(!state.tasks.some(function(t){return t.type==='cyber'}))state.tasks.push({id:'cyber',name:'Cybersecurity',type:'cyber',target:3,since:today()});
    state.cyAdded=true;
  }
  if(!state.msAdded){
    if(!state.tasks.some(function(t){return t.id==='malay'})){
      var ei=-1;state.tasks.forEach(function(t,i){if(t.id==='english')ei=i});
      state.tasks.splice(ei>=0?ei+1:state.tasks.length,0,{id:'malay',name:'Malay language',type:'split',target:2,since:today()});
    }
    state.msAdded=true;
  }
  if(!state.slAdded){
    if(!state.tasks.some(function(t){return t.type==='sleep'}))state.tasks.push({id:'sleep',name:'Sleep',type:'sleep',target:6.5,since:today()});
    state.slAdded=true;
  }
  if(!state.sched||typeof state.sched!=='object')state.sched={};
  if(!state.schedInit){
    Object.keys(DEFAULT_SCHED).forEach(function(k){if(!state.sched[k])state.sched[k]={s:DEFAULT_SCHED[k].s,e:DEFAULT_SCHED[k].e}});
    state.schedInit=true;
  }
  if(!state.prayerAuto||typeof state.prayerAuto!=='object'||!Array.isArray(state.prayerAuto.off)){
    var off=[0,0,0,0,0],bm=prayerMins();
    [0,1].forEach(function(i){var r=state.sched['p'+i],m=r?tmin(r.s):null;if(m!==null)off[i]=Math.max(0,Math.min(300,m-bm[i]))});
    state.prayerAuto={on:true,off:off};
  }
  if(!state.alarm||typeof state.alarm!=='object')state.alarm={on:true};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function pad(n){return n<10?'0'+n:''+n}
function keyOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function daysAgo(n){var d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-n);return d}
function today(){return keyOf(new Date())}
function prune(){
  var cutoff=keyOf(daysAgo(KEEP-1));
  Object.keys(state.logs).forEach(function(k){if(k<cutoff)delete state.logs[k]});
  save();
}
var SPLITS={
  coding:{key:'_cd',names:['Practice','Thinking','Learning'],goals:[2,0.5,2.5]},
  english:{key:'_en',names:['Reading & Vocabulary','Speaking','Writing'],goals:[0.5,1,0.5]},
  malay:{key:'_ms',names:['Reading & Vocabulary','Speaking','Writing'],goals:[0.5,1,0.5]}
};
function fmtH(h){var m=Math.round(h*60);if(m<60)return m+' min';var hh=Math.floor(m/60),mm=m%60;return hh+' h'+(mm?' '+mm+' min':'')}
function hms(ms){var x=Math.max(0,Math.floor(ms/1000)),h=Math.floor(x/3600),m=Math.floor(x%3600/60);return pad(h)+':'+pad(m)+':'+pad(x%60)}
function stopTimer(){
  var tm=state.timer,sp=tm&&SPLITS[tm.id];
  state.timer=null;
  if(!sp)return;
  var hrs=Math.min(12,(Date.now()-tm.t0)/3600000);
  if(hrs<1/720)return;
  var a=cdParts(tm.day,{id:tm.id});
  a[tm.i]=Math.min(24,Math.round((a[tm.i]+hrs)*10000)/10000);
  getLog(tm.day)[sp.key]=a;
}
function startTimer(id,i){stopTimer();state.timer={id:id,i:i,t0:Date.now(),day:today()};rerender()}
function timerBtn(id,i){
  var tm=state.timer;
  if(tm&&tm.id===id&&tm.i===i){
    return el('button',{class:'btn small primary','data-t0':String(tm.t0),text:'\u25A0 Stop '+hms(Date.now()-tm.t0),onclick:function(){stopTimer();rerender()}});
  }
  return el('button',{class:'btn small',text:'\u25B6 Start timer','aria-label':'Start timer',onclick:function(){startTimer(id,i)}});
}
function cdParts(k,t){
  var sp=SPLITS[t.id],l=state.logs[k]||{},a=l[sp.key];
  if(Array.isArray(a))return [Number(a[0])||0,Number(a[1])||0,Number(a[2])||0];
  return [Number(l[t.id])||0,0,0];
}
function getLog(k){return state.logs[k]||(state.logs[k]={})}
function val(k,t){
  var l=(state.logs[k]||{})[t.id];
  if(t.type==='prayer'){return Array.isArray(l)?l.filter(Boolean).length:0}
  if(t.type==='exercise'){
    var ex=(state.logs[k]||{})._ex||[],c=0;
    EX_TARGETS.forEach(function(g,i){if(Number(ex[i])>=g)c++});
    return c;
  }
  if(t.type==='cyber'){var cy=(state.logs[k]||{})._cy||[],cn=0;for(var j=0;j<3;j++)if(cy[j])cn++;return cn}
  if(t.type==='split'){var sp=SPLITS[t.id],cd=cdParts(k,t),s=0;sp.goals.forEach(function(g,i){s+=Math.min(cd[i],g)});return s}
  return Number(l)||0;
}
function pct(k,t){
  var v=val(k,t);
  if(t.type==='check')return v?1:0;
  return Math.min(1,v/(t.target||1));
}
function dayScore(k){
  if(!state.tasks.length)return 0;
  var s=0,n=0;state.tasks.forEach(function(t){if(t.since&&k<t.since)return;s+=pct(k,t);n++});
  return n?s/n:0;
}
function el(tag,attrs,kids){
  var e=document.createElement(tag);
  if(attrs)Object.keys(attrs).forEach(function(a){
    if(a==='class')e.className=attrs[a];
    else if(a==='text')e.textContent=attrs[a];

/* ---------- Prayer times for Satkhira (calculated, no internet needed) ---------- */
var LAT=22.7185,LNG=89.0705,TZ=6;
function dsin(d){return Math.sin(d*Math.PI/180)}
function dcos(d){return Math.cos(d*Math.PI/180)}
function dtan(d){return Math.tan(d*Math.PI/180)}
function darcsin(x){return Math.asin(x)*180/Math.PI}
function darccos(x){return Math.acos(x)*180/Math.PI}
function darctan2(y,x){return Math.atan2(y,x)*180/Math.PI}
function darccot(x){return Math.atan(1/x)*180/Math.PI}
function fixn(a,b){a=a-b*Math.floor(a/b);return a<0?a+b:a}
function julianD(y,m,d){if(m<=2){y-=1;m+=12}var A=Math.floor(y/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5}
function prayerBase(dk){
  var y=+dk.slice(0,4),m=+dk.slice(5,7),d=+dk.slice(8,10);
  var jd=julianD(y,m,d)-LNG/360;
  function sunPos(t){
    var D=jd+t-2451545.0,g=fixn(357.529+0.98560028*D,360),q=fixn(280.459+0.98564736*D,360);
    var L=fixn(q+1.915*dsin(g)+0.020*dsin(2*g),360),e=23.439-0.00000036*D;
    var RA=darctan2(dcos(e)*dsin(L),dcos(L))/15;
    return {decl:darcsin(dsin(e)*dsin(L)),eqt:q/15-fixn(RA,24)};
  }
  function mid(t){return fixn(12-sunPos(t).eqt,24)}
  function ang(a,t,ccw){
    var dec=sunPos(t).decl,noon=mid(t);
    var v=darccos((-dsin(a)-dsin(dec)*dsin(LAT))/(dcos(dec)*dcos(LAT)))/15;
    return noon+(ccw?-v:v);
  }
  function asr(f,t){var dec=sunPos(t).decl;return ang(-darccot(f+dtan(Math.abs(LAT-dec))),t,false)}
  var res=[ang(18,5/24,true),mid(12/24),asr(2,13/24),ang(0.833,18/24,false),ang(18,21/24,false)];
  return res.map(function(h){return Math.round(fixn(h+TZ-LNG/15,24)*60)});
}
var prC={k:'',v:null};
function prayerMins(){var k=today();if(prC.k!==k)prC={k:k,v:prayerBase(k)};return prC.v}
function minToS(m){m=((m%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)}
function getSched(key){
  var pa=state.prayerAuto,m=/^p([0-4])$/.exec(key);
  if(m&&pa&&pa.on){var i=+m[1];return {s:minToS(prayerMins()[i]+(Number(pa.off&&pa.off[i])||0))}}
  return state.sched[key]||{};
}

/* ---------- Schedule ---------- */
function tmin(s){var m=/^(\d{1,2}):(\d{2})$/.exec(s||'');return m?(+m[1])*60+(+m[2]):null}
function fmtT(s){var m=tmin(s);if(m===null)return '';var h=Math.floor(m/60);return (h%12||12)+':'+pad(m%60)+' '+(h<12?'AM':'PM')}
function timeText(key){var r=getSched(key);if(!r||!r.s)return '';return fmtT(r.s)+(r.e?' \u2013 '+fmtT(r.e):'')}
function schedItems(){
  var items=[];
  if(state.tasks.some(function(t){return t.type==='prayer'}))PRAYERS.forEach(function(n,i){items.push({key:'p'+i,name:n,prayer:true})});
  state.tasks.forEach(function(t){if(t.type!=='prayer')items.push({key:t.id,name:t.name})});
  items.forEach(function(x){var r=getSched(x.key);x.m=r?tmin(r.s):null});
  items.sort(function(a,b){if(a.m===null&&b.m===null)return 0;if(a.m===null)return 1;if(b.m===null)return -1;return a.m-b.m});
  return items;
}

function toB64(bytes){var s='',i,n=bytes.length;for(i=0;i<n;i+=8192)s+=String.fromCharCode.apply(null,bytes.subarray(i,Math.min(n,i+8192)));return btoa(s)}
function prepareSound(file,start,len,cb){
  var AC=window.AudioContext||window.webkitAudioContext;
  if(!AC){cb(null,'This browser cannot process audio. Use Chrome or Safari.');return}
  var r=new FileReader();
  r.onerror=function(){cb(null,'Could not read this file. Try another one.')};
  r.onload=function(){
    var ctx;try{ctx=new AC()}catch(e){cb(null,'This browser cannot process audio.');return}
    var fin=false;
    function fail(){if(fin)return;fin=true;try{ctx.close()}catch(e){}cb(null,'This phone cannot read this audio file. Please use an MP3, M4A or WAV file.')}
    function ok(buf){
      if(fin)return;fin=true;
      try{
        var sr=buf.sampleRate,nch=buf.numberOfChannels,total=buf.length,i,c;
        var s0=Math.min(Math.floor(start*sr),Math.max(0,total-1)),s1=Math.min(total,s0+Math.floor(len*sr));
        if(s1-s0<sr/10){cb(null,'The start time is after the end of the song. Use a smaller start number.');return}
        var OUT=22050,ratio=sr/OUT,n=Math.floor((s1-s0)/ratio),out=new Float32Array(n),chs=[];
        for(c=0;c<nch;c++)chs.push(buf.getChannelData(c));
        for(i=0;i<n;i++){
          var a=s0+Math.floor(i*ratio),b=Math.min(s1,s0+Math.floor((i+1)*ratio)),sum=0,cnt=0,j;
          if(b<=a)b=a+1;
          for(j=a;j<b&&j<total;j++){for(c=0;c<nch;c++)sum+=chs[c][j];cnt+=nch}
          out[i]=cnt?sum/cnt:0;
        }
        var fade=Math.min(n,Math.floor(OUT*0.05));
        for(i=0;i<fade;i++)out[n-1-i]*=i/fade;
        var bytes=new Uint8Array(44+n*2),v=new DataView(bytes.buffer);
        function w(o,t){for(var q=0;q<t.length;q++)v.setUint8(o+q,t.charCodeAt(q))}
        w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
        v.setUint32(24,OUT,true);v.setUint32(28,OUT*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
        for(i=0;i<n;i++)v.setInt16(44+i*2,Math.round(Math.max(-1,Math.min(1,out[i]))*32767),true);
        try{ctx.close()}catch(e){}
        cb('data:audio/wav;base64,'+toB64(bytes));
      }catch(e){cb(null,'Could not prepare this file. Try a shorter length.')}
    }
    try{var pr=ctx.decodeAudioData(r.result,ok,fail);if(pr&&pr.catch)pr.catch(fail)}catch(e){fail()}
  };
  r.readAsArrayBuffer(file);
}
/* ---------- Pomodoro timer (own sound from PC or phone) ---------- */
var pomoR={phase:'work',left:0,endAt:0,running:false,n:0},pomoData='',pomoAu=null,pomoNote='',pomoStopT=null,pomoOrigTitle=null;
function kvSave(key,data,cb){
  idbOpen(function(db){
    function fb(){try{localStorage.setItem('daily_tracker_'+key,data);cb(true)}catch(e){cb(false)}}
    if(!db){fb();return}
    try{var tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(data,key);tx.oncomplete=function(){cb(true)};tx.onerror=fb;tx.onabort=fb}catch(e){fb()}
  });

  playPomo();
  try{if(navigator.vibrate)navigator.vibrate([300,150,300])}catch(e){}
  try{if(typeof Notification!=='undefined'&&Notification.permission==='granted')new Notification(was==='work'?'Focus session done':'Break is over',{body:'Next: '+pomoName(pomoR.phase)})}catch(e){}
  pomoNote=(was==='work'?'Focus session done! ':'Break is over! ')+'Next: '+pomoName(pomoR.phase)+'.';
  save();
  if(c.auto){pomoR.endAt=Date.now()+pomoR.left*1000;pomoR.running=true}
  try{render()}catch(e){}
  pomoPaint();
}
function pomoTickFn(){
  if(pomoR.running){
    if(pomoLeft()<=0)pomoDone();else pomoPaint();
  }
}
function viewPomo(root){
  var c=pomoCfg();
  if(!pomoR.left&&!pomoR.running)pomoR.left=pomoLen(pomoR.phase);
  var card=el('div',{class:'card top'});
  card.appendChild(el('h2',{text:'Pomodoro timer'}));
  card.appendChild(el('div',{class:'mute','data-pomo':'phase',style:'text-align:center;font-size:16px',text:''}));
  card.appendChild(el('div',{class:'score','data-pomo':'time',style:'font-size:68px;text-align:center;margin:6px 0',text:''}));
  card.appendChild(el('div',{class:'bar'},[el('i',{'data-pomo':'bar',style:'width:0%'})]));
  var row=el('div',{class:'row',style:'justify-content:center;gap:8px;margin:12px 0;flex-wrap:wrap'},[
    pomoR.running?el('button',{class:'btn primary',text:'Pause',onclick:pomoPause}):el('button',{class:'btn primary',text:'Start',onclick:pomoStart}),
    el('button',{class:'btn',text:'Reset',onclick:pomoReset}),
    el('button',{class:'btn',text:'Skip',onclick:pomoSkip})
  ]);
  card.appendChild(row);
  if(pomoNote)card.appendChild(el('div',{class:'mute',style:'text-align:center;margin:4px 0',text:pomoNote}));
  card.appendChild(el('div',{class:'mute',style:'text-align:center',text:'Focus sessions done today: '+(c.log[today()]||0)}));

  card.appendChild(el('h2',{text:'Settings',style:'margin-top:18px'}));
  function num(label,key,min,max){
    var i=el('input',{type:'number',min:String(min),max:String(max),step:'1','aria-label':label,style:'width:80px;height:36px;font-size:16px'});
    i.value=c[key];
    i.addEventListener('change',function(){
      var v=Math.floor(Number(i.value));if(!(v>=min))v=min;if(v>max)v=max;
      c[key]=v;if(!pomoR.running)pomoR.left=pomoLen(pomoR.phase);rerender();
    });
    return el('div',{class:'row',style:'justify-content:space-between;align-items:center;margin:6px 0'},[el('span',{class:'t',text:label}),i]);
  }
  card.appendChild(num('Focus (minutes)','work',1,180));
  card.appendChild(num('Short break (minutes)','brk',1,60));
  card.appendChild(num('Long break (minutes)','lng',1,120));
  card.appendChild(num('Focus sessions before a long break','every',2,12));
  var au=el('input',{type:'checkbox',class:'chk','aria-label':'Start the next round automatically'});
  au.checked=!!c.auto;au.addEventListener('change',function(){c.auto=au.checked;save()});
  card.appendChild(el('div',{class:'todo'},[au,el('span',{class:'t',text:'Start the next round automatically'})]));

  card.appendChild(el('h2',{text:'Sound',style:'margin-top:18px'}));
  var sel=el('select',{'aria-label':'Pomodoro sound'});
  var list=[['beep','Beep'],['bell','Bell'],['chime','Chime'],['siren','Siren']];
  if(pomoData)list.push(['custom','My own sound']);
  list.forEach(function(o){var op=el('option',{value:o[0],text:o[1]});if(c.sound===o[0])op.selected=true;sel.appendChild(op)});
  sel.addEventListener('change',function(){c.sound=sel.value;save();primePomo();playPomo()});
  var msg=el('div',{class:'mute',style:'margin:4px 0',text:pomoData?'Your own sound is saved. Pick it in the list above.':'Choose a sound, or add your own from this PC or phone.'});
  var f=el('input',{type:'file',accept:'audio/*,.mp3,.m4a,.wav,.ogg,.aac','aria-label':'Choose your own Pomodoro sound'});
  f.addEventListener('change',function(){
    var file=f.files&&f.files[0];if(!file)return;
    if(file.size>30000000){msg.textContent='File is too big (over 30 MB). Pick a smaller song.';return}
    msg.textContent='Preparing your song... please wait a few seconds.';
    prepareSound(file,sndStart,sndLen,function(d,err){
      if(!d){msg.textContent=err;return}
      kvSave('pomo_sound',d,function(ok){
        if(!ok){msg.textContent='Could not save in the browser. Try a shorter length.';return}
        pomoData=d;c.sound='custom';pomoNote='';save();
        render();primePomo();playPomo();
      });
    });
  });
  card.appendChild(sel);
  card.appendChild(el('div',{class:'mute',text:'Or use your own song or sound (any size, MP3 / M4A / WAV):',style:'margin-top:8px'}));
  card.appendChild(trimBox());
  card.appendChild(f);
  card.appendChild(msg);
  var br=el('div',{class:'row',style:'gap:8px;flex-wrap:wrap;margin-top:6px'},[
    el('button',{class:'btn small',text:'Test sound',onclick:function(){primePomo();playPomo()}})
  ]);
  if(pomoData)br.appendChild(el('button',{class:'btn small',text:'Remove my sound',onclick:function(){
    kvDelete('pomo_sound');pomoData='';if(c.sound==='custom')c.sound='bell';pomoAu=null;save();render();
  }}));
  card.appendChild(br);
  card.appendChild(el('p',{class:'mute',text:'The sound rings only while this page is open. Keep the page open and the screen on while the timer runs.'}));
  root.appendChild(card);
  pomoPaint();
}
function render(){
  document.getElementById('dateLine').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  var nav=document.getElementById('tabs');nav.textContent='';
  TABS.forEach(function(t){
    nav.appendChild(el('button',{role:'tab','aria-selected':tab===t[0]?'true':'false',text:t[1],onclick:function(){tab=t[0];btnArm=null;render()}}));
  });
  var selBtn=nav.querySelector('[aria-selected="true"]');if(selBtn&&selBtn.scrollIntoView)selBtn.scrollIntoView({inline:'nearest',block:'nearest'});
  var root=document.getElementById('view');root.textContent='';
  if(tab==='today'){viewToday(root);sidebarify(root);}
  else if(tab==='pomo')viewPomo(root);
  else if(HEADER_SECS[tab])viewSec(root,tab);
  else if(tab==='week')viewWeek(root);
  else if(tab==='month')viewMonth(root);
  else if(tab==='best')viewBest(root);
  else viewHistory(root);
}
setInterval(function(){
  var bs=document.querySelectorAll('[data-t0]');
  for(var i=0;i<bs.length;i++)bs[i].textContent='\u25A0 Stop '+hms(Date.now()-Number(bs[i].getAttribute('data-t0')));
  var ls=document.querySelectorAll('[data-live]');
  for(var j=0;j<ls.length;j++)ls[j].textContent=alarmStatus();
},1000);
if(typeof document.addEventListener==='function'){document.addEventListener('click',unlockAudio,{once:true});document.addEventListener('touchstart',unlockAudio,{once:true});document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){holdAwake();checkAlarms()}})}
setInterval(checkAlarms,5000);
load();render();checkAlarms();loadPomoSound();setInterval(pomoTickFn,500);
})();
</script>
</body>
</html>
